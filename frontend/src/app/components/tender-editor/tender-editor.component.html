<div class="editor-container" *ngIf="tenderData">
  
  <!-- BARRE D'ACTIONS DU HAUT ET EN-TÊTE -->
  <div class="top-actions">
    <div class="header-title-group">
      <h2>✏️ Gestion des Profils & Critères</h2>
      <span class="badge-ref">{{ tenderData.reference }}</span>
    </div>

    <!-- GROUPE DE BOUTONS D'ACTION (HAUT) -->
    <div class="header-buttons-group">
      <button routerLink="/list" class="btn-back" type="button">
        ⬅ Retour à la liste
      </button>

      <button 
        class="btn-save-top" 
        (click)="onValidate()" 
        [disabled]="isSaving"
        type="button">
        <span *ngIf="isSaving">⏳ Enregistrement...</span>
        <span *ngIf="!isSaving">💾 Valider les modifications</span>
      </button>
    </div>
  </div>

  <!-- CONTEXTE DE LA MISSION GLOBALE -->
  <section class="card context-card">
    <label class="form-label font-bold">🌍 Contexte / Mission Globale :</label>
    <textarea 
      class="form-control"
      [(ngModel)]="extractedData.contexte_mission_globale" 
      rows="3" 
      placeholder="Entrez le contexte général de l'appel d'offres...">
    </textarea>
  </section>

  <!-- SECTION PÉRIMÈTRE GÉOGRAPHIQUE (PAYS PAR PAYS AVEC DÉTECTION DES DOUBLONS) -->
  <section class="card context-card">
    <label class="form-label font-bold">🌐 Périmètre géographique de l'AO :</label>
    
    <div class="regions-list">
      <div *ngFor="let region of regionsList; let i = index; trackBy: trackByIndex" class="region-item-wrapper">
        
        <div class="region-row">
          <input 
            type="text" 
            class="form-control region-input" 
            [class.is-duplicate]="isDuplicateRegion(i)"
            [(ngModel)]="regionsList[i]" 
            placeholder="Entrez un pays ou une région..." 
          />
          <button 
            type="button" 
            class="btn-delete-region" 
            (click)="removeRegion(i)" 
            title="Supprimer ce pays">
            ❌
          </button>
        </div>

        <!-- ⚠️ Avertissement visuel en cas de doublon -->
        <small *ngIf="isDuplicateRegion(i)" class="duplicate-warning">
          ⚠️ Ce pays / région est déjà présent dans la liste.
        </small>

      </div>
    </div>

    <!-- Bouton pour ajouter un nouveau champ -->
    <button type="button" class="btn-add-region" (click)="addRegion()">
      ➕ Ajouter un pays / région
    </button>
  </section>

  <!-- LISTE DES PROFILS -->
  <div class="profiles-list">
    <div *ngFor="let profile of extractedData.profils; let pIndex = index" class="card profile-card">
      
      <!-- EN-TÊTE DU PROFIL -->
      <div class="profile-header-grid">
        <div class="form-group flex-title">
          <label class="form-label">Titre du Poste :</label>
          <input 
            class="form-control form-control-lg"
            [(ngModel)]="profile.titre_du_poste" 
            placeholder="ex: Chef de Projet, Développeur..."
          />
        </div>
        
        <div class="form-group qty-group">
          <label class="form-label">Quantité :</label>
          <input 
            type="number" 
            class="form-control text-center"
            [(ngModel)]="profile.quantite_demandee" 
          />
        </div>

        <button class="btn-danger-outline" (click)="removeProfile(pIndex)" type="button">
          🗑️ Supprimer le profil
        </button>
      </div>

      <!-- OBSERVATIONS -->
      <div class="form-group observations-group">
        <label class="form-label-sub">Observations / Remarques IA sur ce poste :</label>
        <input 
          class="form-control form-control-sm"
          [(ngModel)]="profile.observations" 
          placeholder="Aucune observation" 
        />
      </div>

      <!-- CRITÈRES D'ÉVALUATION -->
      <div class="criteria-section">
        <h4 class="criteria-section-title">📋 Critères d'évaluation requis :</h4>
        
        <div class="criteria-list">
          <div *ngFor="let criterion of profile.criteres_evaluation; let cIndex = index" class="criterion-edit-item">
            
            <div class="criterion-row-top">
              <input 
                class="form-control criterion-type-input"
                [(ngModel)]="criterion.type_critere" 
                placeholder="Type de critère" 
              />
              
              <input 
                class="form-control criterion-desc-input"
                [(ngModel)]="criterion.libelle_exigence" 
                placeholder="Libellé de l'exigence (ex: Diplôme Bac+5 en informatique...)" 
              />
              
              <button class="btn-remove-crit" (click)="removeCriterion(pIndex, cIndex)" type="button" title="Supprimer ce critère">
                ✖
              </button>
            </div>

            <div class="criterion-row-bottom">
              <div class="form-inline-group">
                <label class="form-label-inline">Points Max :</label>
                <input 
                  type="number" 
                  step="0.01" 
                  class="form-control pts-input text-center"
                  [(ngModel)]="criterion.points_maximum" 
                />
              </div>
              
              <div class="form-inline-group flex-grow">
                <label class="form-label-inline">Règle de calcul :</label>
                <input 
                  class="form-control rule-input"
                  [(ngModel)]="criterion.regle_notation" 
                  placeholder="Ex: 2 pts si >= 5 ans d'expérience, 0 sinon" 
                />
              </div>
            </div>

          </div>
        </div>

        <button class="btn-add-criterion" (click)="addCriterion(pIndex)" type="button">
          ➕ Ajouter une exigence / critère
        </button>
      </div>

    </div>
  </div>

  <!-- BOUTON AJOUTER UN PROFIL -->
  <button class="btn-add-profile" (click)="addProfile()" type="button">
    ➕ Ajouter un nouveau profil de poste
  </button>

  <!-- ALERTE DE SUCCÈS -->
  <div *ngIf="showSuccessMessage" class="banner success-banner">
    ✅ Modifications enregistrées en base de données avec succès !
  </div>

  <!-- ACTION DE SAUVEGARDE (BAS DE PAGE) -->
  <div class="save-actions">
    <button 
      class="btn-save" 
      (click)="onValidate()" 
      [disabled]="isSaving"
      type="button">
      <span *ngIf="isSaving">⏳ Enregistrement en cours...</span>
      <span *ngIf="!isSaving">💾 Valider toutes les modifications</span>
    </button>
  </div>

</div>

<!-- ÉTAT DE CHARGEMENT -->
<div *ngIf="!tenderData" class="loading-state">
  <div class="spinner"></div>
  <p>⏳ Récupération de la structure de l'Appel d'Offres...</p>
</div>
