<div class="upload-container">
  
  <!-- BOUTON RETOUR -->
  <div class="top-actions">
    <button routerLink="/list" class="btn-back" type="button">
      ⬅ Retour à la liste
    </button>
  </div>

  <!-- EN-TÊTE DU FORMULAIRE -->
  <div class="upload-header">
    <div class="upload-icon">📄</div>
    <h2 class="upload-title">Nouvel Appel d'Offres</h2>
    <p class="upload-subtitle">
      Uploadez votre fichier PDF et indiquez les pages à analyser par l'Intelligence Artificielle.
    </p>
  </div>

  <!-- FORMULAIRE D'UPLOAD -->
  <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="upload-form">
    
    <div class="form-grid">
      
      <!-- TITRE DE L'APPEL D'OFFRES -->
      <div class="form-group">
        <label class="form-label" for="tender-title">
          Titre de l'appel d'offres :
        </label>
        <input 
          id="tender-title"
          type="text" 
          class="form-control"
          formControlName="title"
          placeholder="Ex: Refonte du système d'information" 
        />
      </div>

      <!-- PAGES À ANALYSER -->
      <div class="form-group">
        <label class="form-label" for="tender-pages">
          Pages à analyser :
        </label>
        <input 
          id="tender-pages"
          type="text" 
          class="form-control"
          formControlName="pages"
          placeholder="ex: 37,38 ou 10-15" 
        />
        <small class="form-hint">
          Séparez les pages par des virgules (ex: 1,4,5).
        </small>
      </div>

      <!-- SELECTION DE FICHIER PDF -->
      <div class="form-group">
        <label class="form-label">
          Fichier PDF :
        </label>
        
        <div class="dropzone">
          <input 
            *ngIf="!selectedFile"
            type="file" 
            class="file-input"
            (change)="onFileSelected($event)"
            accept=".pdf" 
          />

          <div *ngIf="selectedFile" class="file-preview">
            <span class="file-name">
              📄 {{ selectedFile.name }}
            </span>
            <button 
              type="button" 
              class="btn-remove-file"
              (click)="clearFile()"
              title="Retirer le fichier">
              ✖
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- BOUTONS D'ACTION -->
    <div class="form-actions">
      <button 
        type="button" 
        class="btn-secondary"
        (click)="onCancel()">
        Vider
      </button>
      
      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="!selectedFile">
        ✨ Analyser le PDF
      </button>
    </div>

  </form>

</div>
